{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        QR-код — {{ survey.title }}
    </title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            color: #111;
            background: #fff;
        }

        .print-page {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        .description {
            margin-bottom: 25px;
            font-size: 18px;
            line-height: 1.5;
        }

        .qr-code {
            width: 360px;
            max-width: 90%;
            height: auto;
        }

        .instruction {
            margin-top: 20px;
            font-size: 20px;
            font-weight: 600;
        }

        .public-url {
            margin-top: 20px;
            padding: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
            border: 1px solid #bbb;
            border-radius: 8px;
        }

        .actions {
            margin-top: 30px;
        }

        .actions button,
        .actions a {
            display: inline-block;
            margin: 5px;
            padding: 10px 18px;
            color: #111;
            font-size: 16px;
            text-decoration: none;
            background: #fff;
            border: 1px solid #666;
            border-radius: 6px;
            cursor: pointer;
        }

        @media print {
            body {
                padding: 0;
            }

            .actions {
                display: none;
            }

            .print-page {
                max-width: none;
            }
        }
    </style>
</head>

<body>
    <div class="print-page">
        <h1>
            {{ survey.title }}
        </h1>

        {% if survey.description %}
            <div class="description">
                {{ survey.description|linebreaksbr }}
            </div>
        {% endif %}

        <img
            src="{% url 'surveys:survey_qr_code' survey.pk %}"
            alt="QR-код формы"
            class="qr-code"
        >

        <div class="instruction">
            Отсканируйте QR-код камерой телефона
        </div>

        <div class="public-url">
            {{ public_url }}
        </div>

        <div class="actions">
            <button
                type="button"
                onclick="window.print()"
            >
                Печать
            </button>

            <a
                href="{% url 'surveys:survey_qr_code_download' survey.pk %}"
            >
                Скачать PNG
            </a>

            <a
                href="{% url 'surveys:survey_edit' survey.pk %}"
            >
                Вернуться к форме
            </a>
        </div>
    </div>
</body>
</html>
