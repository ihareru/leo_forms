name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: leovit-forms-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run Django tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: leovit_forms
          POSTGRES_USER: leovit_forms_user
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd
          "pg_isready
          -U leovit_forms_user
          -d leovit_forms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: >-
        postgresql://leovit_forms_user:change_me@127.0.0.1:5432/leovit_forms
      DJANGO_SECRET_KEY: github-actions-test-secret-key
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements/development.txt

      - name: Check PostgreSQL connection
        run: |
          python - <<'PY'
          import psycopg

          connection = psycopg.connect(
              "postgresql://"
              "leovit_forms_user:"
              "change_me@"
              "127.0.0.1:"
              "5432/"
              "leovit_forms"
          )

          print(
              "PostgreSQL connection successful"
          )

          connection.close()
          PY

      - name: Check Django configuration
        run: |
          python manage.py check

      - name: Run tests
        run: |
          python manage.py test

  deploy:
    name: Deploy to forms.ihare.ru
    runs-on: ubuntu-latest
    needs:
      - test

    environment:
      name: production
      url: https://forms.ihare.ru

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' \
            "$DEPLOY_SSH_KEY" \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' \
            "$DEPLOY_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run production deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-leovit-forms"